# Local development data stores. Services bind to 127.0.0.1 only.
# Usage: pnpm infra:up / pnpm infra:down
name: entroworld

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: entroworld
      POSTGRES_PASSWORD: entroworld
      POSTGRES_DB: entroworld
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entroworld -d entroworld"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Presence, matchmaking and chat fan-out only; nothing here needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    # Voice (proximity voice and 1:1 calls). Development mode with a local-only key pair that matches
    # LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.example. Host networking keeps WebRTC media
    # (UDP 7882, TCP 7881) simple; signalling is on 7880. Everything binds to 127.0.0.1.
    image: livekit/livekit-server:v1.13.10
    network_mode: host
    command: ["--dev", "--bind", "127.0.0.1", "--node-ip", "127.0.0.1"]
    environment:
      LIVEKIT_KEYS: "entroworld-dev: entroworld-dev-livekit-secret-0123456789abcdef"

volumes:
  postgres-data:
