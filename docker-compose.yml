# Local development data stores. Services bind to 127.0.0.1 only.
# Usage: pnpm infra:up / pnpm infra:down
name: entroworld

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: entroworld
      POSTGRES_PASSWORD: entroworld
      POSTGRES_DB: entroworld
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entroworld -d entroworld"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Presence, matchmaking and chat fan-out only; nothing here needs to survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
